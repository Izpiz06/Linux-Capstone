---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dataset-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataset-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataset-catalog
  template:
    metadata:
      labels:
        app: dataset-catalog
    spec:
      containers:
        - name: app
          image: dataset-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: dataset-data

---
apiVersion: v1
kind: Service
metadata:
  name: dataset-catalog
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: dataset-catalog

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dataset-catalog
spec:
  to:
    kind: Service
    name: dataset-catalog
  port:
    targetPort: 5000
