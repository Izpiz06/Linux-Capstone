version: '3.8'

services:
  dataset-catalog:
    build:
      context: .
      dockerfile: Containerfile
    image: research-dataset-catalog:latest
    container_name: research-dataset-catalog
    ports:
      - "5000:5000"
    environment:
      - DATA_DIR=/data
      - PORT=5000
    volumes:
      - catalog-data:/data:Z
    restart: unless-stopped

volumes:
  catalog-data:
    name: catalog-data
